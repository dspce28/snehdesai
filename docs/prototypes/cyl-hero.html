<style>
/* Layout: a film opening. Title card, a gold line of light, cinema bars that open on a defocused Queen's Necklace, then a pull-back through the layers around Sneh. */
:root{
  --night:#05070d;
  --ink:#0c0c0b;
  --brass:#c9a46a;
  --brass-hi:#e2c38c;
  --ivory:#f4f1ea;
  --serif:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --sans:"Jost","Futura","Century Gothic",system-ui,sans-serif;
  --u:1px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--night);color:var(--ivory)}
body{font-family:var(--sans);font-weight:400;overflow:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
:focus-visible{outline:1px solid var(--brass-hi);outline-offset:3px}

.hero{position:relative;height:100%;min-height:320px;overflow:hidden;isolation:isolate;background:var(--night)}
.stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.cam{position:absolute;inset:0;transform-origin:50.5% 69.5%}
.br{position:absolute;inset:0;transform-origin:50.5% 69.5%;animation:breathe 26s ease-in-out 9.2s infinite alternate}
@keyframes breathe{to{transform:scale(1.035) translateY(-.4%)}}
.layer{position:absolute;inset:0;transform-origin:50.5% 69.5%}
.layer img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;user-select:none;-webkit-user-drag:none}

/* sky life */
.clouds{position:absolute;inset:0 0 52% 0;overflow:hidden;mix-blend-mode:screen;opacity:.6;pointer-events:none}
.clouds i{position:absolute;left:-40%;width:180%;height:100%;
  background:radial-gradient(28% 7% at 20% 32%,rgba(255,190,140,.22),transparent 70%),radial-gradient(22% 5% at 62% 26%,rgba(255,170,130,.18),transparent 70%),radial-gradient(30% 6% at 84% 44%,rgba(200,170,255,.14),transparent 70%),radial-gradient(18% 4% at 40% 52%,rgba(255,200,160,.16),transparent 70%);
  animation:drift 70s linear infinite}
.clouds i:nth-child(2){top:8%;opacity:.7;animation-duration:110s;animation-direction:reverse;filter:blur(6px)}
@keyframes drift{to{transform:translateX(22%)}}
.shade{position:absolute;inset:0 0 50% 0;background:linear-gradient(rgba(4,6,14,.62),transparent)}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 55%,transparent 55%,rgba(3,4,8,.55))}

/* gold dust drifting in front of the city */
.dust{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.dust i{position:absolute;bottom:-4%;border-radius:50%;background:radial-gradient(circle,rgba(255,214,150,.9),rgba(255,190,110,0) 70%);animation:rise linear infinite}
@keyframes rise{from{transform:translate(0,0);opacity:0}15%{opacity:.8}85%{opacity:.6}to{transform:translate(var(--dx),-70vh);opacity:0}}

/* headline */
.headline{position:absolute;top:0;height:100%;pointer-events:none}
.word-wrap{position:absolute;left:50%;transform:translateX(-50%);text-align:center}
.kicker{display:block;font-family:var(--serif);font-style:italic;font-weight:400;line-height:1;white-space:nowrap;letter-spacing:-.01em;color:var(--ivory);text-shadow:0 2px 30px rgba(0,0,0,.35)}
h1.word{position:relative;margin:0;font-family:var(--serif);font-weight:400;line-height:1;letter-spacing:-.035em;white-space:nowrap;color:var(--ivory);text-shadow:0 4px 60px rgba(0,0,0,.25)}
h1.word > span{display:inline-block}
.shine{position:absolute;inset:0;color:transparent;-webkit-background-clip:text;background-clip:text;pointer-events:none;
  background-image:linear-gradient(100deg,transparent 35%,rgba(255,226,170,.0) 40%,rgba(255,222,160,.95) 50%,rgba(255,226,170,0) 60%,transparent 65%);
  background-size:300% 100%;background-position:120% 0;background-repeat:no-repeat}
.shine span{display:inline-block}

/* nav */
nav.top{position:absolute;z-index:5;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 52*var(--u));height:calc(48*var(--u));
  padding-left:max(calc(125*var(--u)),env(safe-area-inset-left,0px));padding-right:max(calc(125*var(--u)),env(safe-area-inset-right,0px));
  display:flex;align-items:center;justify-content:space-between;font-size:calc(15*var(--u))}
.mark{font-family:var(--serif);font-weight:500;font-size:calc(18*var(--u));letter-spacing:.3em;text-transform:uppercase;white-space:nowrap}
.pills{position:absolute;left:50%;top:0;height:100%;transform:translateX(-50%);display:flex;gap:calc(6*var(--u));padding:calc(5*var(--u));border-radius:999px;
  background:rgba(255,255,255,.12);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.pills a{display:flex;align-items:center;height:100%;padding:0 calc(22*var(--u));border-radius:999px;color:rgba(244,241,234,.85);white-space:nowrap;transition:background .25s}
.pills a:hover{background:rgba(255,255,255,.14)}
.pills a[aria-current]{background:var(--ivory);color:var(--ink);font-weight:500}
.right{display:flex;align-items:center;gap:calc(28*var(--u))}
.lang{font-size:calc(13*var(--u));letter-spacing:.1em;color:rgba(244,241,234,.85);white-space:nowrap}
.cta{display:inline-flex;align-items:center;height:calc(44*var(--u));padding:0 calc(26*var(--u));border-radius:999px;background:var(--brass);color:var(--ink);
  font-weight:500;font-size:calc(12*var(--u));letter-spacing:.24em;text-transform:uppercase;white-space:nowrap;transition:transform .25s,background .25s}
.cta:hover{transform:translateY(-1px);background:var(--brass-hi)}
.cta .short{display:none}

/* event line */
.event{position:absolute;z-index:5;left:max(calc(125*var(--u)),env(safe-area-inset-left,0px));right:max(calc(125*var(--u)),env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 40*var(--u));
  display:flex;align-items:center;gap:calc(18*var(--u));font-size:calc(12*var(--u));letter-spacing:.28em;text-transform:uppercase;color:rgba(244,241,234,.88)}
.event .rule{height:1px;width:calc(48*var(--u));background:var(--brass);transform-origin:left;flex:none}
.event span{text-shadow:0 1px 12px rgba(0,0,0,.7);white-space:nowrap}
.event .sig{color:var(--brass-hi)}
.event .dot{color:var(--brass)}

.film{position:absolute;inset:0;z-index:7;pointer-events:none;background:#000}

.film .l{left:0;background-position:0 50%;transform-origin:0 50%}
.film .r{right:0;background-position:100% 50%;transform-origin:100% 50%}
.film .spot{position:absolute;inset:0;background:radial-gradient(38% 55% at 50% 42%,rgba(255,214,160,.22),transparent 70%),radial-gradient(120% 80% at 50% 50%,transparent 50%,rgba(0,0,0,.65));mix-blend-mode:screen}
.film .dim{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 45%,transparent 45%,rgba(0,0,0,.7))}
.title{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-size:12px;letter-spacing:.6em;text-transform:uppercase;color:rgba(244,241,234,.82);padding-left:.6em}
.title .mono{display:block;font-family:var(--serif);font-size:clamp(44px,8vh,84px);letter-spacing:.06em;color:#d6b57a;text-shadow:0 0 30px rgba(214,181,122,.35);margin-bottom:22px;padding-left:0}
.title b{display:block;font-family:var(--serif);font-weight:400;font-style:italic;letter-spacing:.01em;text-transform:none;font-size:clamp(30px,4.6vh,46px);margin-top:14px;color:var(--ivory)}
.replay{position:absolute;z-index:8;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);font:400 11px var(--sans);letter-spacing:.2em;text-transform:uppercase;
  color:rgba(244,241,234,.6);background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.15);border-radius:999px;padding:7px 12px;cursor:pointer}
.replay:hover{color:var(--ivory)}

@media (max-width:819px){
  nav.top{top:calc(env(safe-area-inset-top,0px) + 16px);height:auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));flex-wrap:wrap;row-gap:12px}
  .mark{font-size:14px;letter-spacing:.22em}
  .right{gap:14px}.lang{font-size:12px}
  .cta{height:36px;padding:0 16px;font-size:11px;letter-spacing:.18em}
  .pills{position:static;transform:none;order:3;width:100%;height:40px;padding:4px;gap:4px}
  .pills a{flex:1;justify-content:center;height:32px;padding:0 6px;font-size:12px}
  .event{left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 58px);justify-content:center;flex-wrap:wrap;text-align:center;gap:8px 12px;font-size:10px;letter-spacing:.2em;padding-inline:16px}
  .event .rule,.event .dot{display:none}
  .event .sig{flex-basis:100%}
  .replay{right:50%;transform:translateX(50%)}
}
@media (max-width:379px){.cta .long{display:none}.cta .short{display:inline}.pills a{font-size:11px;padding:0 4px}}
@media (max-height:500px) and (min-width:600px){
  nav.top{top:12px;height:34px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));font-size:12px}
  .mark{font-size:13px}.pills{height:34px;padding:3px}.pills a{padding:0 14px;font-size:12px}.cta{height:32px;font-size:10px}
  .event{bottom:12px;left:24px;font-size:10px}
}
@media (prefers-reduced-motion:reduce){.clouds i,.dust i,.br{animation:none}}

<script>
(function(){
const R = 2720/1920, T = 9000;
const $ = id => document.getElementById(id);
const hero=$('hero'), stage=$('stage'), word=$('word'), kicker=$('kicker'), wrap=$('wordWrap'), headline=$('headline');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* gold dust */
const dust=$('dust');
for(let i=0;i<22;i++){ const d=document.createElement('i'); const s=2+Math.random()*5;
  d.style.cssText=`left:${Math.random()*100}%;width:${s}px;height:${s}px;--dx:${(Math.random()-.5)*120}px;animation-duration:${14+Math.random()*16}s;animation-delay:${-Math.random()*20}s;filter:blur(${Math.random()<.4?1.5:0}px)`;
  dust.appendChild(d); }

/* layout */
let perEm=1.6, kPerEm=5;
function measure(){
  const p=document.createElement('span'); p.style.cssText='position:absolute;visibility:hidden;white-space:nowrap;font:400 100px var(--serif);letter-spacing:-.035em';
  p.textContent='Life'; document.body.appendChild(p); perEm=p.getBoundingClientRect().width/100;
  p.style.font='italic 400 100px var(--serif)'; p.style.letterSpacing='-.01em'; p.textContent='Change Your'; kPerEm=p.getBoundingClientRect().width/100; p.remove();
}
function layout(){
  const vw=hero.clientWidth, vh=hero.clientHeight;
  const u = vw<820 ? 1 : Math.min(vw/1440, vh/900);
  document.documentElement.style.setProperty('--u',u+'px');
  const sw=Math.max(vw,vh*R), sh=sw/R; stage.style.width=sw+'px'; stage.style.height=sh+'px';
  const stageTop=(vh-sh)/2, portrait=vh>vw*1.2;
  const baseline=sh*(portrait?.462:.47);           // head top sits at 42.6% of the stage
  const KR=.32;                                     // kicker size relative to the word
  const nav=$('nav').getBoundingClientRect();
  const navBottom=nav.bottom-hero.getBoundingClientRect().top-stageTop+vh*.03;
  const avail=baseline-navBottom;                   // room for kicker + word above the baseline
  const byHeight=avail/(.80+KR*1.02);
  const fs=Math.max(56,Math.min(byHeight, vw*.8/perEm, sw*.48/perEm, vw*.92/(kPerEm*KR)));
  word.style.fontSize=fs+'px'; kicker.style.fontSize=(fs*KR)+'px';
  headline.style.left=((sw-vw)/2)+'px'; headline.style.width=vw+'px';
  wrap.style.top=(baseline-fs*.80-fs*KR*1.02)+'px';
  kicker.style.marginBottom=(-fs*.02)+'px';
}

/* timeline: one clock drives every Web Animation */
const anims=[];
function A(el,frames,times,eases){
  const kf=frames.map((f,i)=>Object.assign({},f,{offset:times[i]/T,easing:(eases&&eases[i])||'linear'}));
  const a=el.animate(kf,{duration:T,fill:'both'}); a.pause(); anims.push(a); return a;
}
const hold=(v)=>[v,v];
function build(){
  anims.splice(0).forEach(a=>a.cancel());
  const out='cubic-bezier(.16,1,.3,1)', io='cubic-bezier(.65,0,.35,1)';
  // 1. curtains under a spotlight, title card on the velvet
  A($('film'),[{backgroundColor:'#000'},{backgroundColor:'rgba(0,0,0,0)'},{backgroundColor:'rgba(0,0,0,0)'}],[0,1,T]);
  A($('spot'),[{opacity:0},{opacity:0},{opacity:1},{opacity:1},{opacity:0},{opacity:0}],[0,100,900,1700,2300,T],['linear','ease-out','linear','ease-in']);
  A($('title'),[{opacity:0,letterSpacing:'.95em'},{opacity:0,letterSpacing:'.95em'},{opacity:1,letterSpacing:'.6em'},{opacity:1,letterSpacing:'.6em'},{opacity:0,letterSpacing:'.5em'},{opacity:0}],[0,250,1150,1650,2000,T],['linear','cubic-bezier(.2,.6,.2,1)','linear','ease-in']);
  // 2. curtains draw open, fabric gathering as it travels
  A($('cl'),[{transform:'translateX(0) scaleX(1)'},{transform:'translateX(0) scaleX(1)'},{transform:'translateX(0) scaleX(.985)'},{transform:'translateX(-101%) scaleX(.78)'},{transform:'translateX(-101%) scaleX(.78)'}],[0,1800,2050,3250,T],['linear','ease-out','cubic-bezier(.55,.1,.25,1)']);
  A($('cr'),[{transform:'translateX(0) scaleX(1)'},{transform:'translateX(0) scaleX(1)'},{transform:'translateX(0) scaleX(.985)'},{transform:'translateX(101%) scaleX(.78)'},{transform:'translateX(101%) scaleX(.78)'}],[0,1800,2050,3350,T],['linear','ease-out','cubic-bezier(.6,.15,.3,1)']);
  // 3. drone-style pull-back over the bay, out of focus into focus
  A($('cam'),[{transform:'scale(1.55) translateY(-3%)',filter:'blur(10px) brightness(.55)'},{transform:'scale(1.55) translateY(-3%)',filter:'blur(10px) brightness(.55)'},{transform:'scale(1.06) translateY(0)',filter:'blur(0px) brightness(1)'},{transform:'scale(1)',filter:'blur(0px) brightness(1)'},{transform:'scale(1)',filter:'blur(0px) brightness(1)'}],[0,1900,4300,7600,T],['linear','cubic-bezier(.45,0,.2,1)','cubic-bezier(.4,0,.2,1)']);
  // 4. headline: kicker, then Life letter by letter out of a blur
  A(kicker,[{opacity:0,transform:'translateY(.35em)',filter:'blur(8px)'},{opacity:0,transform:'translateY(.35em)',filter:'blur(8px)'},{opacity:1,transform:'none',filter:'blur(0)'},{opacity:1,transform:'none',filter:'blur(0)'}],[0,3700,4600,T],['linear',out]);
  [...word.children].filter(s=>!s.classList.contains('shine')).forEach((s,i)=>{ const t0=3900+i*110;
    A(s,[{opacity:0,transform:'translateY(.22em) scale(1.04)',filter:'blur(14px)'},{opacity:0,transform:'translateY(.22em) scale(1.04)',filter:'blur(14px)'},{opacity:1,transform:'none',filter:'blur(0)'},{opacity:1,transform:'none',filter:'blur(0)'}],[0,t0,t0+1000,T],['linear',out]); });
  A(headline,[{transform:'translateY(5%)'},{transform:'translateY(5%)'},{transform:'translateY(0)'},{transform:'translateY(0)'}],[0,3900,5800,T],['linear','cubic-bezier(.3,0,.4,1)']);
  // 5. the city lifts slightly while Sneh rises from below, overshoots and settles
  A($('mid'),[{transform:'translateY(0)'},{transform:'translateY(0)'},{transform:'translateY(-3%)'},{transform:'translateY(-3%)'},{transform:'translateY(0)'},{transform:'translateY(0)'}],[0,4000,5300,5600,7800,T],['linear','cubic-bezier(.45,0,.3,1)','linear','cubic-bezier(.45,0,.55,1)']);
  A($('front'),[{transform:'translateY(70%)'},{transform:'translateY(70%)'},{transform:'translateY(-2.5%)'},{transform:'translateY(0)'},{transform:'translateY(0)'}],[0,4250,6700,7900,T],['linear','cubic-bezier(.2,.55,.2,1)','cubic-bezier(.45,0,.55,1)']);
  // 6. gold sweep across Life, then the chrome
  A($('shine'),[{backgroundPosition:'120% 0'},{backgroundPosition:'120% 0'},{backgroundPosition:'-20% 0'},{backgroundPosition:'-20% 0'}],[0,6900,8100,T],['linear','cubic-bezier(.45,0,.2,1)']);
  A($('nav'),[{opacity:0,transform:'translateY(-8px)'},{opacity:0,transform:'translateY(-8px)'},{opacity:1,transform:'none'},{opacity:1,transform:'none'}],[0,4300,5000,T],['linear',out]);
  A($('event'),[{opacity:0,transform:'translateY(8px)'},{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'none'},{opacity:1,transform:'none'}],[0,6800,7600,T],['linear',out]);
  A($('rule'),[{transform:'scaleX(0)'},{transform:'scaleX(0)'},{transform:'scaleX(1)'},{transform:'scaleX(1)'}],[0,6800,7700,T],['linear',out]);
  A($('cta'),[{boxShadow:'0 0 0 0 rgba(201,164,106,.75)'},{boxShadow:'0 0 0 0 rgba(201,164,106,.75)'},{boxShadow:'0 0 0 14px rgba(201,164,106,0)'},{boxShadow:'0 0 0 0 rgba(201,164,106,0)'}],[0,7900,8600,T],['linear','ease-out']);
}
let raf;
function play(){
  cancelAnimationFrame(raf); $('film').hidden=false; $('replay').hidden=true; build();
  const t0=performance.now();
  (function tick(now){ const t=Math.min(T,now-t0); anims.forEach(a=>a.currentTime=t);
    if(t<T) raf=requestAnimationFrame(tick); else { $('film').hidden=true; $('replay').hidden=false; } })(t0);
}
function imagesReady(){ return Promise.all([...document.images].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r;}))); }
let started=false;
function start(){ if(started) return; started=true; measure(); layout();
  if(reduce){ build(); anims.forEach(a=>a.currentTime=T); $('film').hidden=true; } else setTimeout(play,120); }
// hold on the title card state until media is ready
build(); anims.forEach(a=>a.currentTime=0);
addEventListener('resize',()=>{ layout(); });
$('replay').addEventListener('click',play);
Promise.all([document.fonts?document.fonts.ready:1, imagesReady()]).then(start);
setTimeout(start,5000);
measure(); layout();
})();
</script>
