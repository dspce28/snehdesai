<style>
/* Layout: one cinematic screen. A 16:9 stage covers the viewport; sky, headline, city and Sneh are stacked layers that drift apart. Curtains open onto it. */
:root{
  --night:#070a12;
  --ink:#0c0c0b;
  --brass:#c9a46a;
  --brass-hi:#dcbd86;
  --ivory:#f4f1ea;
  --serif:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --sans:"Jost","Futura","Century Gothic",system-ui,sans-serif;
  --u:1px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--night);color:var(--ivory)}
body{font-family:var(--sans);font-weight:400;overflow:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
:focus-visible{outline:1px solid var(--brass-hi);outline-offset:3px}

.hero{position:relative;height:100%;min-height:320px;overflow:hidden;isolation:isolate;background:var(--night)}
.stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.layer{position:absolute;inset:0}
.layer img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;user-select:none;-webkit-user-drag:none}
.back{transform-origin:50% 40%}
.mid{transform-origin:50% 45%}
.front{transform-origin:50% 100%}
.mid img{height:104%}   /* bleed so the parallax lift never shows a gap at the bottom */

/* moving sky: soft cloud bands drifting, only visible above the skyline */
.clouds{position:absolute;inset:0 0 50% 0;overflow:hidden;mix-blend-mode:screen;opacity:.55;pointer-events:none}
.clouds i{position:absolute;left:-40%;width:180%;height:100%;
  background:
    radial-gradient(28% 7% at 20% 32%,rgba(255,190,140,.22),transparent 70%),
    radial-gradient(22% 5% at 62% 26%,rgba(255,170,130,.18),transparent 70%),
    radial-gradient(30% 6% at 84% 44%,rgba(200,170,255,.14),transparent 70%),
    radial-gradient(18% 4% at 40% 52%,rgba(255,200,160,.16),transparent 70%);
  animation:drift 70s linear infinite}
.clouds i:nth-child(2){top:8%;opacity:.7;animation-duration:110s;animation-direction:reverse;filter:blur(6px)}
@keyframes drift{to{transform:translateX(22%)}}
.shade{position:absolute;inset:0 0 55% 0;background:linear-gradient(rgba(5,8,20,.55),transparent);opacity:0}

/* headline */
.headline{position:absolute;top:0;height:100%;display:flex;justify-content:center;pointer-events:none}
.word-wrap{position:absolute;display:inline-block;transform:translateX(-50%)}
.kicker{display:block;font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:-.005em;white-space:nowrap;line-height:1}
h1.word{margin:0;font-family:var(--serif);font-weight:400;line-height:1;letter-spacing:-.035em;white-space:nowrap;color:var(--ivory)}
h1.word span{display:inline-block}

/* nav */
nav.top{position:absolute;z-index:5;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 52*var(--u));height:calc(48*var(--u));
  padding-left:max(calc(125*var(--u)),env(safe-area-inset-left,0px));padding-right:max(calc(125*var(--u)),env(safe-area-inset-right,0px));
  display:flex;align-items:center;justify-content:space-between;font-size:calc(15*var(--u))}
.mark{font-family:var(--serif);font-weight:500;font-size:calc(18*var(--u));letter-spacing:.3em;text-transform:uppercase;white-space:nowrap}
.pills{position:absolute;left:50%;top:0;height:100%;transform:translateX(-50%);display:flex;gap:calc(6*var(--u));padding:calc(5*var(--u));border-radius:999px;
  background:rgba(255,255,255,.12);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.pills a{display:flex;align-items:center;height:100%;padding:0 calc(22*var(--u));border-radius:999px;color:rgba(244,241,234,.85);white-space:nowrap;transition:background .25s}
.pills a:hover{background:rgba(255,255,255,.14)}
.pills a[aria-current]{background:var(--ivory);color:var(--ink);font-weight:500}
.right{display:flex;align-items:center;gap:calc(28*var(--u))}
.lang{font-size:calc(13*var(--u));letter-spacing:.1em;color:rgba(244,241,234,.85);white-space:nowrap}
.cta{display:inline-flex;align-items:center;height:calc(44*var(--u));padding:0 calc(26*var(--u));border-radius:999px;background:var(--brass);color:var(--ink);
  font-weight:500;font-size:calc(12*var(--u));letter-spacing:.24em;text-transform:uppercase;white-space:nowrap;transition:transform .25s,background .25s}
.cta:hover{transform:translateY(-1px);background:var(--brass-hi)}
.cta .short{display:none}

/* event line */
.event{position:absolute;z-index:5;left:max(calc(125*var(--u)),env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 40*var(--u));
  display:flex;align-items:center;gap:calc(18*var(--u));font-size:calc(12*var(--u));letter-spacing:.28em;text-transform:uppercase;color:rgba(244,241,234,.85)}
.event .rule{height:1px;width:calc(48*var(--u));background:var(--brass);transform-origin:left}
.event span{text-shadow:0 1px 12px rgba(0,0,0,.6)}

/* opening */
.opening{position:absolute;inset:0;z-index:6;overflow:hidden;background:var(--night)}
.opening .stage img{width:100%;height:100%;object-fit:cover;display:block;transform-origin:52% 62%}

  const baseline = sh*(portrait ? .33 : .37);            // in stage px; Sneh's head top is at 28.3%
  const nav = $('nav').getBoundingClientRect();
  const navBottomInStage = nav.bottom - hero.getBoundingClientRect().top - stageTop + vh*.035;
  const capRoom = (baseline - navBottomInStage)/0.88;
  const fs = Math.max(56, Math.min(sw*.52/perEm, vw*.8/perEm, capRoom));
  word.style.fontSize = fs+'px';
  kicker.style.fontSize = (fs*.13)+'px';
  headline.style.left = ((sw - vw)/2)+'px'; headline.style.width = vw+'px';
  // place the word so its baseline sits on `baseline` (Bodoni ascent ~0.78em at line-height 1)
  const kh = fs*.13, top = baseline - fs*.80 - kh - fs*.02;
  wrap.style.top = top+'px'; wrap.style.left = '50%';
  kicker.style.marginLeft = (fs*.04)+'px';
}

/* ---------- timeline ---------- */
const anims = [];
function A(el, frames, offsets, easings){
  const kf = frames.map((f,i)=>Object.assign({}, f, {offset:offsets[i]/T, easing:easings[i]||'linear'}));
  const a = el.animate(kf, {duration:T, fill:'both'}); a.pause(); anims.push(a); return a;
}
function build(){
  anims.splice(0).forEach(a=>a.cancel());
  const cl=$('cl'), cr=$('cr');
  A(cl,[{transform:'translateX(0) scaleX(1)'},{transform:'translateX(0) scaleX(.985)'},{transform:'translateX(-101%) scaleX(.8)'},{transform:'translateX(-101%) scaleX(.8)'}],[0,250,1250,T],['ease-out','cubic-bezier(.1,.2,.8,1)']);
  A(cr,[{transform:'translateX(0) scaleX(1)'},{transform:'translateX(0) scaleX(.985)'},{transform:'translateX(101%) scaleX(.8)'},{transform:'translateX(101%) scaleX(.8)'}],[0,250,1350,T],['ease-out','cubic-bezier(.4,.6,.9,1)']);
  // crane pull-back over the plate: starts tight on the bay, settles on the full frame
  A($('plate'),[{transform:'scale(1.55) translateY(-4%)',filter:'brightness(.55) blur(1.5px)'},{transform:'scale(1.55) translateY(-4%)',filter:'brightness(.55) blur(1.5px)'},{transform:'scale(1) translateY(0)',filter:'brightness(1) blur(0px)'},{transform:'scale(1)',filter:'brightness(1) blur(0px)'}],[0,300,2850,T],['linear','cubic-bezier(.55,0,.15,1)']);
  A($('opening'),[{opacity:1},{opacity:1},{opacity:0},{opacity:0}],[0,2450,2950,T],['linear','cubic-bezier(.45,0,.55,1)']);
  A($('nav'),[{opacity:0,transform:'translateY(-6px)'},{opacity:0,transform:'translateY(-6px)'},{opacity:1,transform:'none'},{opacity:1,transform:'none'}],[0,2450,2750,T],['linear','ease-out']);
  A(kicker,[{opacity:0,transform:'translateY(.5em)'},{opacity:0,transform:'translateY(.5em)'},{opacity:1,transform:'none'},{opacity:1,transform:'none'}],[0,2450,3100,T],['linear','cubic-bezier(.2,.65,.3,1)']);
  [...word.children].forEach((s,i)=>{ const t0=2450+i*70;
    A(s,[{opacity:0,transform:'translateY(.14em)'},{opacity:0,transform:'translateY(.14em)'},{opacity:1,transform:'none'},{opacity:1,transform:'none'}],[0,t0,t0+700,T],['linear','cubic-bezier(.2,.65,.3,1)']); });
  A($('shade'),[{opacity:0},{opacity:0},{opacity:1},{opacity:1}],[0,2900,3700,T],['linear','ease-in-out']);
    A($('mid'),[{transform:'translateY(0)'},{transform:'translateY(0)'},{transform:'translateY(-4%)'},{transform:'translateY(-4%)'},{transform:'translateY(0)'},{transform:'translateY(0)'}],[0,2900,4300,4600,6900,T],['linear','cubic-bezier(.45,0,.3,1)','linear','cubic-bezier(.45,0,.55,1)']);
  A(headline,[{transform:'translateY(6%)'},{transform:'translateY(6%)'},{transform:'translateY(0)'},{transform:'translateY(0)'}],[0,3000,4800,T],['linear','cubic-bezier(.3,0,.4,1)']);
  A($('front'),[{transform:'translateY(66%)'},{transform:'translateY(66%)'},{transform:'translateY(-2.5%)'},{transform:'translateY(0)'},{transform:'translateY(0)'}],[0,3350,6000,7300,T],['linear','cubic-bezier(.2,.5,.2,1)','cubic-bezier(.45,0,.55,1)']);
  A($('event'),[{opacity:0},{opacity:0},{opacity:1},{opacity:1}],[0,5800,6600,T],['linear','ease-out']);
  A($('rule'),[{transform:'scaleX(0)'},{transform:'scaleX(0)'},{transform:'scaleX(1)'},{transform:'scaleX(1)'}],[0,5800,6600,T],['linear','cubic-bezier(.2,.65,.3,1)']);
  A($('cta'),[{boxShadow:'0 0 0 0 rgba(201,164,106,.7)'},{boxShadow:'0 0 0 0 rgba(201,164,106,.7)'},{boxShadow:'0 0 0 12px rgba(201,164,106,0)'},{boxShadow:'0 0 0 0 rgba(201,164,106,0)'}],[0,6200,6800,T],['linear','ease-out']);
}
function finish(){
  hero.classList.remove('intro');
  $('opening').hidden = true; $('curtains').hidden = true; $('replay').hidden = false;
}
let raf;
function play(){
  cancelAnimationFrame(raf);
  $('opening').hidden = false; $('curtains').hidden = false; $('replay').hidden = true;
  hero.classList.add('intro'); build(); hero.classList.remove('intro');
  const t0 = performance.now();
  (function tick(now){
    const t = Math.min(T, now - t0);
    anims.forEach(a => a.currentTime = t);
    if (t < T) raf = requestAnimationFrame(tick); else finish();
  })(t0);
}
function ready(){
  const imgs=[...document.images];
  return Promise.all(imgs.map(i => i.complete ? 1 : new Promise(r => { i.onload = i.onerror = r; })));
}

addEventListener('resize', layout);
$('replay').addEventListener('click', play);
const fonts = document.fonts ? document.fonts.ready : Promise.resolve();
let started=false;
function start(){ if(started) return; started=true; measure(); layout(); if (reduce){ build(); anims.forEach(a=>a.currentTime=T); finish(); } else setTimeout(play,120); }
Promise.all([fonts, ready()]).then(start);
setTimeout(start, 5000);
measure(); layout();
})();
</script>
